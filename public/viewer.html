<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss 刷新 · 好友查看版</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 390px at 75% -10%,#1b355c 0%,transparent 65%),#0e1119;color:#e8eef9;font-family:system-ui,"Microsoft YaHei",sans-serif;padding:22px}.wrap{max-width:1150px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0 0 8px}button{border:1px solid #46516a;border-radius:22px;color:#e8eef9;background:#202a3c;padding:9px 16px;cursor:pointer;font-weight:650}.active{background:#2563eb;border-color:#3b82f6}.old.active{background:#aa6505;border-color:#d97706}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{font-size:12px;color:#9baac0}.panel{margin-top:18px;border:1px solid #303a4b;border-radius:15px;overflow:hidden;background:#151b25}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #303a4b}th{background:#202b3d;color:#a9b7cd;font-size:12px}td{font-size:14px}.count{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}.soon{color:#ffce72}.due{color:#ff9191}.muted{color:#8592a6}.name{font-weight:700}.summary{margin-top:12px;color:#a2aec1;font-size:13px}.error{color:#ff9292}footer{padding:22px 0;color:#8291a8;font-size:12px}@media(max-width:620px){body{padding:10px}th,td{padding:9px 5px;font-size:12px}.zone{display:none}}</style></head><body><div class="wrap"><header><div><h1>⚔️ Boss 刷新 · 好友查看</h1><div class="status" id="status">正在连接云端…</div></div><div class="tools"><button id="newBtn" class="active" onclick="selectMode('new')">🆕 新区</button><button id="oldBtn" class="old" onclick="selectMode('old')">🕰️ 老区</button><button onclick="load()">↻ 刷新</button></div></header><div class="summary" id="summary">自动每 30 秒检查云端数据</div><div class="panel"><table><thead><tr><th class="zone">地区</th><th>Boss</th><th>下次刷新</th><th>倒计时</th><th>状态 / 几率</th></tr></thead><tbody id="list"></tbody></table></div><footer>只读模式 · 不需要账号或 API Key · 数据由管理员同步后更新。这里不会修改云端记录。</footer></div><script>
let mode='new',rows=[],catalog=[],updatedAt='';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseTime(v){if(!v)return NaN;const n=Date.parse(v);return Number.isFinite(n)?n:NaN;}
function selectMode(m){mode=m;document.getElementById('newBtn').classList.toggle('active',m==='new');document.getElementById('oldBtn').classList.toggle('active',m==='old');load();}
async function load(){const el=document.getElementById('status');el.textContent='⏳ 正在读取 '+(mode==='new'?'新区':'老区')+'…';try{let resp=await fetch('/api/boss?mode='+mode,{cache:'no-store'});if(!resp.ok)throw new Error('HTTP '+resp.status);let data=await resp.json();rows=Array.isArray(data.bosses)?data.bosses:[];catalog=data._catalog?.bosses||[];updatedAt=data.updatedAt||'';el.textContent='✅ 已连接云端 · '+(updatedAt?'最近同步 '+new Date(updatedAt).toLocaleString('zh-CN'):'等待管理员同步');render();}catch(e){el.textContent='❌ 云端读取失败：'+e.message;el.classList.add('error');}}
function render(){const now=Date.now();const arr=[...rows].sort((a,b)=>(parseTime(a.time)||Infinity)-(parseTime(b.time)||Infinity));const format=v=>new Date(v).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});const body=document.getElementById('list');body.innerHTML=arr.map(b=>{const t=parseTime(b.time);const delta=t-now;const c=catalog.find(x=>x.name===b.name);const prob=c?.prob??b.prob??'-';let count='未设置',status='待更新',cls='muted';if(Number.isFinite(t)){if(delta>0){const s=Math.floor(delta/1000);count=Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m '+String(s%60).padStart(2,'0')+'s';status=delta<=300000?'5分钟内':delta<=1800000?'30分钟内':'等待中';cls=delta<=300000?'due':delta<=1800000?'soon':'';}else{count='已过';status='已过时间';cls='muted';}}return `<tr><td class="zone muted">${safe(b.zone||c?.zone||'')}</td><td class="name">${safe(b.name)}</td><td>${Number.isFinite(t)?format(t):'-'}</td><td class="count ${cls}">${count}</td><td>${status} · ${safe(prob)}%</td></tr>`}).join('')||'<tr><td colspan="5">暂无云端 Boss 数据</td></tr>';document.getElementById('summary').textContent='当前 '+arr.length+' 条 Boss · 每 30 秒检查云端 · 查看模式不会修改记录';}
load();setInterval(load,30000);setInterval(render,1000);
</script></body></html>
