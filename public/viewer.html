<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss 刷新</title>
<style>
:root{color-scheme:dark;--bg:#10151e;--line:#303a4b;--text:#e8eef9;--muted:#9eabc0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(950px 420px at 80% -15%,#1b355c 0%,transparent 65%),#0e1119;color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif;padding:20px}.wrap{max-width:1200px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0 0 8px}button,select,input{font:inherit}button{border:1px solid #44516a;border-radius:22px;color:#e8eef9;background:#202a3c;padding:7px 13px;cursor:pointer;font-size:12px;font-weight:650}button:hover{filter:brightness(1.16)}button.active{background:#2563eb;border-color:#3b82f6}button.old.active{background:#a56707;border-color:#d97706}.tools,.remindTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status,.minor{font-size:12px;color:var(--muted)}.remindBar{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px;background:#171e2a;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.remindTools label{font-size:12px;color:#c9d2e2}.remindTools select{background:#222c3d;border:1px solid #3f4b62;border-radius:8px;color:white;padding:6px}.remindTools input{accent-color:#60a5fa;width:90px}.summary{margin-top:14px;color:#a2aec1;font-size:12px}.panel{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:auto;background:#151b25}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}th{background:#202b3d;color:#a9b7cd;font-size:12px}td{font-size:13px}.count{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}.soon{color:#ffc46b}.due{color:#ff9393}.muted{color:#8592a6}.name{font-weight:700;white-space:nowrap}.required{background:rgba(179,57,62,.12)}.required .name,.required .percent{color:#ef9393;font-weight:750}.must{display:inline-block;background:rgba(229,100,100,.12);border:1px solid rgba(229,100,100,.26);color:#ee9393;border-radius:12px;padding:2px 7px;font-size:11px;margin-left:5px}.bar{font-size:13px;color:#f6d49c}.error{color:#ff9292}.glass{position:fixed;bottom:25px;left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:.3s;padding:15px 28px;border:1px solid #64748b;border-radius:18px;background:rgba(45,53,72,.88);box-shadow:0 20px 60px #0009;backdrop-filter:blur(12px);font-size:21px;font-weight:800;text-align:center;z-index:20}.glass.show{opacity:1;transform:translate(-50%,0)}footer{padding:20px 0;color:#8291a8;font-size:12px}@media(max-width:650px){body{padding:10px}h1{font-size:19px}th,td{padding:9px 7px;font-size:12px}.remindBar{gap:9px}}

/* 新区蓝 / 老区橙：切换时整页背景、控制条与表格联动 */
body { transition:background .25s ease; }
body.mode-new { background:radial-gradient(970px 480px at 80% -15%,rgba(37,99,235,.25),transparent 67%),linear-gradient(180deg,#111a2b 0%,#10151e 64%,#0e1119 100%); }
body.mode-old { background:radial-gradient(970px 480px at 80% -15%,rgba(217,119,6,.26),transparent 67%),linear-gradient(180deg,#281d15 0%,#1d1918 64%,#111214 100%); }
body.mode-new .remindBar,body.mode-new .panel { background:rgba(18,30,49,.94);border-color:rgba(96,165,250,.30); }
body.mode-old .remindBar,body.mode-old .panel { background:rgba(39,29,22,.94);border-color:rgba(251,191,36,.30); }
body.mode-new th { background:#203048; }
body.mode-old th { background:#3a2a1c; }
body.mode-new tbody tr:not(.required):hover { background:rgba(59,130,246,.09); }
body.mode-old tbody tr:not(.required):hover { background:rgba(245,158,11,.09); }
/* 倒计时始终使用统一的明亮文字，不再按剩余时间变黄/红 */
.count,.count.soon,.count.due,.count.muted { color:#e8eef9; }

/* 双区合并与下一只 Boss 名称提示 */
body.mode-merge{background:radial-gradient(760px 460px at 15% -10%,rgba(37,99,235,.18),transparent 70%),radial-gradient(760px 460px at 95% -10%,rgba(217,119,6,.16),transparent 70%),#0e1119}
body.mode-merge .remindBar,body.mode-merge .panel{background:#171e2a}
button#mergeBtn.active{background:#6546a3;border-color:#9c7be2}
.merge-new{background:rgba(37,99,235,.075)}
.merge-old{background:rgba(217,119,6,.075)}
.merge-new td:first-child{border-left:3px solid #4288e6}
.merge-old td:first-child{border-left:3px solid #d99032}
.server-tag{display:inline-block;white-space:nowrap;border-radius:10px;font-size:11px;padding:3px 8px}
.server-tag.new{color:#a6cafa;background:rgba(37,99,235,.17)}
.server-tag.old{color:#ffd08b;background:rgba(217,119,6,.17)}
/* 名称高亮优先于必刷红色，倒计时保持统一浅白色 */
.name.boss-next,.required .name.boss-next{color:#67aeff!important;text-shadow:0 0 12px rgba(72,155,255,.28);font-weight:800}
.count,.count.soon,.count.due{color:#e8eef9!important}

/* 与管理员原版一致：刷新时间已过超过 1 分钟的 Boss 整行淡化。
   优先级不覆盖区服背景与必刷标识，整行一起降低亮度。 */
#list tr.boss-past { opacity: .5; }
#list tr.boss-past .name { color: #9299a8; }
#list tr.boss-past .count { color: #9299a8 !important; }



/* 恢复管理员原版的统一深色视觉：新区、老区、合并查看全部一致。
   仅保留区服按钮和合并列表小标记，用于辨识数据。 */
:root { --bg:#0e0f13; --line:#2a2f3a; --text:#e6e8ee; --muted:#8b93a3; }
body,body.mode-new,body.mode-old,body.mode-merge {
  background:
    radial-gradient(1100px 520px at 85% -10%, rgba(37,99,235,.18), transparent 60%),
    radial-gradient(900px 480px at -10% 20%, rgba(245,158,11,.10), transparent 55%),
    radial-gradient(800px 500px at 50% 115%, rgba(14,165,233,.10), transparent 60%),
    linear-gradient(180deg, #111318 0%, #0e0f13 100%) !important;
  background-attachment:fixed !important;
  color:#e6e8ee;
}
.wrap {
  max-width:1300px;
  border-radius:22px;
  padding:16px 20px 20px;
  background:rgba(22,25,33,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 8px 28px -8px rgba(0,0,0,.55);
}
body.mode-new .remindBar,body.mode-old .remindBar,body.mode-merge .remindBar,
body.mode-new .panel,body.mode-old .panel,body.mode-merge .panel,
.remindBar,.panel {background:#1a1d24 !important;border-color:#2a2f3a !important;}
body.mode-new th,body.mode-old th,body.mode-merge th,th {background:#20242d !important;color:#8b93a3 !important;}
body.mode-new button,body.mode-old button,body.mode-merge button,button,
body.mode-new .remindTools select,body.mode-old .remindTools select,body.mode-merge .remindTools select {
  background:#232833;border-color:#353c49;color:#e6e8ee;
}
body.mode-new button#newBtn.active,body.mode-old button#newBtn.active,body.mode-merge button#newBtn.active {background:#2563eb;border-color:#3b82f6;}
body.mode-new button#oldBtn.active,body.mode-old button#oldBtn.active,body.mode-merge button#oldBtn.active {background:#a56707;border-color:#d97706;}
body.mode-new button#mergeBtn.active,body.mode-old button#mergeBtn.active,body.mode-merge button#mergeBtn.active {background:#6546a3;border-color:#9c7be2;}
body.mode-new tbody tr:not(.required):hover,body.mode-old tbody tr:not(.required):hover,body.mode-merge tbody tr:not(.required):hover {background:#20242d;}
/* 合并时两区仅用细边框和区服标签区别，不整行染色。 */
body.mode-merge tr.merge-new,body.mode-merge tr.merge-old {background:transparent;}
/* 状态规则保持：下一只蓝色名称、必刷红色、过期整行灰色。 */
#list tr.boss-past {opacity:.5;}
#list tr.boss-past .name {color:#9299a8;}
#list tr.boss-past .count {color:#9299a8 !important;}
.count,.count.soon,.count.due,.count.muted {color:#e8eef9 !important;}
#list tr.boss-past .count {color:#9299a8 !important;}
@media(max-width:650px){.wrap{padding:12px 10px;}}
</style></head><body class="mode-new"><div class="wrap">
<header><div><h1>⚔️ Boss 刷新</h1><div class="status" id="status">正在连接云端…</div></div><div class="tools"><button id="newBtn" class="active" onclick="selectMode('new')">🆕 新区</button><button id="oldBtn" class="old" onclick="selectMode('old')">🕰️ 老区</button><button id="mergeBtn" onclick="selectMode('merge')">📊 合并查看</button><button onclick="loadBoth()">↻ 刷新</button></div></header>
<div class="remindBar"><div class="remindTools"><span class="bar" id="clock">🇨🇳 北京 --:--:--</span><label>🔔 提前</label><select id="advance"><option value="1000">1 秒（到点提醒）</option><option value="60000">1 分钟</option><option value="120000">2 分钟</option><option value="180000">3 分钟</option><option value="300000">5 分钟</option></select><label>🔊 音量</label><input type="range" min="0" max="100" value="70" id="volume"><span id="volumeText" class="minor">70%</span></div><div class="remindTools"><span class="minor" id="remindState">提醒已开启 · 请测试声音</span><button id="toggleBtn" onclick="toggleAlerts()">⏸ 暂停</button><button onclick="testAlert()">🔔 测试声音</button></div></div>
<div class="summary" id="summary">新区、老区均每 10 秒检查云端；浏览器允许播放声音后才会播报</div><div class="panel"><table><thead><tr><th>地区</th><th>Boss</th><th>下次刷新（北京时间）</th><th>倒计时</th><th>状态 / 几率</th></tr></thead><tbody id="list"></tbody></table></div>
<footer>好友只读模式 · 保留语音与到点提示 · 无法编辑或上传。请保持网页打开并避免让电脑休眠；浏览器在后台可能延迟提醒。</footer></div><div id="glass" class="glass" role="status"></div>
<script>
'use strict';
const ZONE='Asia/Shanghai'; let mode='new';const records={new:[],old:[]};let meta={new:{},old:{}};let enabled=true;let audioCtx=null;let voiceQueue=[];let speaking=false;let lastError='';
const seen=new Map(); const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeVal=v=>{if(!v)return NaN;const d=Date.parse(v);return Number.isFinite(d)?d:NaN};
const fmt=new Intl.DateTimeFormat('zh-CN',{timeZone:ZONE,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const clockFmt=new Intl.DateTimeFormat('zh-CN',{timeZone:ZONE,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function selectMode(m){
 if(!['new','old','merge'].includes(m))return;
 mode=m;
 document.body.classList.toggle('mode-new',m==='new');
 document.body.classList.toggle('mode-old',m==='old');
 document.body.classList.toggle('mode-merge',m==='merge');
 document.getElementById('newBtn').classList.toggle('active',m==='new');
 document.getElementById('oldBtn').classList.toggle('active',m==='old');
 document.getElementById('mergeBtn').classList.toggle('active',m==='merge');
 render();
}
function settingsInit(){try{const d=JSON.parse(localStorage.getItem('bossViewerRemindersV2')||'{}');if(d.advance)document.getElementById('advance').value=d.advance;if(Number.isFinite(d.volume))document.getElementById('volume').value=d.volume;if(typeof d.enabled==='boolean')enabled=d.enabled;}catch{} updateSettingView();}
function saveSettings(){try{localStorage.setItem('bossViewerRemindersV2',JSON.stringify({advance:document.getElementById('advance').value,volume:Number(document.getElementById('volume').value),enabled}))}catch{}}
function updateSettingView(){document.getElementById('volumeText').textContent=document.getElementById('volume').value+'%';document.getElementById('toggleBtn').textContent=enabled?'⏸ 暂停':'▶ 启用';document.getElementById('remindState').textContent=enabled?'提醒已开启 · 请测试声音':'提醒已暂停';}
function toggleAlerts(){enabled=!enabled;updateSettingView();saveSettings();if(enabled)unlockAudio();}
function unlockAudio(){try{audioCtx ||= new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){console.warn(e)}}
function sound(){try{unlockAudio();if(!audioCtx)return;const vol=Number(document.getElementById('volume').value)/100;if(!vol)return;const t=audioCtx.currentTime;[880,1100,880,1100,880].forEach((f,i)=>{const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.value=f;g.gain.setValueAtTime(Math.max(.0001,vol*.20),t+i*.19);g.gain.exponentialRampToValueAtTime(.0001,t+i*.19+.15);osc.connect(g);g.connect(audioCtx.destination);osc.start(t+i*.19);osc.stop(t+i*.19+.15);});}catch(e){console.warn(e)}}
function enqueueSpeech(text){if(!('speechSynthesis' in window))return;voiceQueue.push(text);processVoice();}
function processVoice(){if(speaking||!voiceQueue.length)return;speaking=true;const text=voiceQueue.shift();try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.9;u.volume=Number(document.getElementById('volume').value)/100;let done=false;const finish=()=>{if(done)return;done=true;speaking=false;setTimeout(processVoice,180)};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(finish,12000)}catch(e){speaking=false;processVoice()}}
function glass(text){const x=document.getElementById('glass');x.textContent=text;x.classList.add('show');clearTimeout(glass.timer);glass.timer=setTimeout(()=>x.classList.remove('show'),7000)}
function fire(m,b,testing=false){sound();const title=(m==='new'?'新区 ':'老区 ')+b.name;glass('🔔 '+title+' · 即将刷新');enqueueSpeech(title+'，即将刷新！');if(!testing&&'Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body:'Boss 即将刷新',tag:'boss-'+m+'-'+b.id})}catch{}}}
function testAlert(){unlockAudio();fire(mode,{name:'提醒测试',id:'test'},true);document.getElementById('remindState').textContent='🔊 已触发测试；如无声音请检查浏览器静音/系统音量';}
function checkAlerts(){if(!enabled)return;const now=Date.now(),lead=Number(document.getElementById('advance').value)||1000;for(const m of ['new','old'])for(const b of records[m]){const t=timeVal(b.time);if(!Number.isFinite(t))continue;const key=m+'|'+(b.id||b.name)+'|'+t;if(seen.has(key))continue;const diff=t-now;if(diff<=lead&&diff>=-60000){seen.set(key,now);fire(m,b)}}if(seen.size>600){for(const [k,v] of seen)if(now-v>86400000)seen.delete(k)}}
async function loadBoth(){const el=document.getElementById('status');el.textContent='⏳ 正在更新新区和老区…';const results=await Promise.allSettled(['new','old'].map(async m=>{const resp=await fetch('/api/boss?mode='+m,{cache:'no-store'});if(!resp.ok)throw new Error(m+' HTTP '+resp.status);const data=await resp.json();records[m]=Array.isArray(data.bosses)?data.bosses:[];meta[m]={catalog:Array.isArray(data._catalog?.bosses)?data._catalog.bosses:[],updatedAt:data.updatedAt||''};}));let failures=results.map((r,i)=>r.status==='rejected'?(['new','old'][i]+': '+r.reason.message):'').filter(Boolean);lastError=failures.join('; ');el.classList.toggle('error',!!failures.length);el.textContent=failures.length?'⚠️ '+lastError:'✅ 新区、老区云端数据已连接 · 北京时间';render();}
function render(){
 const now=Date.now();
 document.getElementById('clock').textContent='🇨🇳 北京 '+clockFmt.format(now);
 const merged=mode==='merge';
 const items=(merged
  ? ['new','old'].flatMap(m=>records[m].map(b=>({...b,_mode:m})))
  : records[mode].map(b=>({...b,_mode:mode})))
  .sort((a,b)=>{const ta=timeVal(a.time),tb=timeVal(b.time);return (Number.isFinite(ta)?ta:Infinity)-(Number.isFinite(tb)?tb:Infinity)});
 const upcoming=items.find(b=>Number.isFinite(timeVal(b.time))&&timeVal(b.time)>=now);
 const upcomingKey=upcoming ? upcoming._mode+'|'+(upcoming.id||upcoming.name)+'|'+upcoming.time : null;
 const head=document.querySelector('.panel thead tr');
 head.innerHTML='<th>地区</th><th>Boss</th>'+(merged?'<th>区服</th>':'')+'<th>下次刷新（北京时间）</th><th>倒计时</th><th>状态 / 几率</th>';
 document.getElementById('list').innerHTML=items.map(b=>{
  const t=timeVal(b.time),delta=t-now;
  const c=(meta[b._mode].catalog||[]).find(x=>x.name===b.name);
  const prob=Number(c?.prob??b.prob??0);
  const mandatory=prob===100;
  const key=b._mode+'|'+(b.id||b.name)+'|'+b.time;
  const isNext=upcomingKey===key;
  // 管理员原版规则：过期超过一分钟才将整行灰显。
  const isPast=Number.isFinite(t)&&delta< -60000;
  let count='未设置',status='待更新';
  if(Number.isFinite(t)){
   if(delta>=0){const sec=Math.floor(delta/1000);count=Math.floor(sec/3600)+'h '+String(Math.floor(sec%3600/60)).padStart(2,'0')+'m '+String(sec%60).padStart(2,'0')+'s';status=delta<=300000?'5分钟内':delta<=1800000?'30分钟内':'等待中';}
   else if(delta>-60000){count='🔥 ≤1分钟';status='刷新窗口';}
   else{count='已过';status='已过时间';}
  }
  return `<tr class="${mandatory?'required ':''}${merged?'merge-'+b._mode:''}${isPast?' boss-past':''}">
   <td class="muted">${safe(b.zone||c?.zone||'')}</td>
   <td class="name ${isNext?'boss-next':''}">${safe(b.name)}</td>
   ${merged?'<td><span class="server-tag '+b._mode+'">'+(b._mode==='new'?'🆕 新区':'🕰️ 老区')+'</span></td>':''}
   <td>${Number.isFinite(t)?fmt.format(t).replace(/\//g,'-'):'-'}</td>
   <td class="count">${count}</td>
   <td><span class="${mandatory?'percent':''}">${safe(status)} · ${safe(prob)}%</span>${mandatory?'<span class="must">必刷</span>':''}</td>
   </tr>`;
 }).join('')||`<tr><td colspan="${merged?6:5}">暂无云端 Boss 数据</td></tr>`;
 document.getElementById('summary').textContent=(merged?'新区＋老区合并':mode==='new'?'新区':'老区')+' · '+items.length+' 条 Boss · 🔵 蓝色名称为下一个即将刷新 · 灰色为已过期 · 🔴 100% 必刷 · 每10秒读取云端 · 只读';
}
document.getElementById('volume').addEventListener('input',()=>{updateSettingView();saveSettings()});document.getElementById('advance').addEventListener('change',saveSettings);settingsInit();loadBoth();setInterval(()=>{render();checkAlerts()},1000);setInterval(loadBoth,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadBoth()});
</script></body></html>
